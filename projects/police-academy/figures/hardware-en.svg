<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" role="img" aria-labelledby="infra-1-title infra-1-desc" data-infra="hardware" style="display:block;width:100%;height:auto;font-family:Segoe UI,Microsoft YaHei,sans-serif"><style>svg{font-family:"Segoe UI","Microsoft YaHei",sans-serif}.lab-small{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#627184}</style><title id="infra-1-title">Proposed hardware &amp; campus connectivity</title><desc id="infra-1-desc">Campus-intranet hardware schematic. Three computing and storage servers and two application servers connect through the campus network to sixty student workstations and two 100-inch indoor full-color LED cloud displays. Authorized APIs can connect other campus systems. Teaching computers and displays follow project configuration updates. The original topology and equipment schedule use different server-role labels.</desc><defs><marker id="infra-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#a3844a" stroke-width="1.5"/></marker></defs><style>[data-infra] text{font-family:inherit;fill:#20334b}[data-infra] .infra-page{fill:#fffdf8;stroke:#ded6c9}[data-infra] .infra-campus{fill:#f3f0e8;stroke:#ded6c9;stroke-dasharray:7 5}[data-infra] .infra-card{fill:#fffdf8;stroke:#ded6c9}[data-infra] .infra-title{font-size:27px;font-weight:700}[data-infra] .infra-subtitle{font-size:17px;fill:#637080}[data-infra] .infra-campus-label{font-size:16px;font-weight:700;letter-spacing:1px;fill:#7f273f}[data-infra] .infra-card-title{font-size:19px;font-weight:700}[data-infra] .infra-detail{font-size:17px;fill:#637080}[data-infra] .infra-badge{fill:#f3f0e8}[data-infra] .infra-quantity{font-size:28px;font-weight:750;text-anchor:middle;fill:#7f273f}[data-infra] .infra-unit{font-size:14px;text-anchor:middle;fill:#637080}[data-infra] .infra-network{fill:#20334b}[data-infra] .infra-network-title{font-size:21px;font-weight:700