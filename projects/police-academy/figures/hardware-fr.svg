<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" role="img" aria-labelledby="infra-2-title infra-2-desc" data-infra="hardware" style="display:block;width:100%;height:auto;font-family:Segoe UI,Microsoft YaHei,sans-serif"><style>svg{font-family:"Segoe UI","Microsoft YaHei",sans-serif}.lab-small{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#627184}</style><title id="infra-2-title">Matériel proposé et connexions du campus</title><desc id="infra-2-desc">Schéma du matériel sur l’intranet du campus. Trois serveurs de calcul et de stockage et deux serveurs applicatifs sont reliés à soixante postes étudiants et à deux ensembles d’écrans infonuagiques LED intérieurs en couleurs de 100 pouces. Des API autorisées peuvent relier les autres systèmes du campus. Les ordinateurs et écrans suivent la configuration complémentaire du projet. Les rôles des serveurs diffèrent entre la topologie d’origine et le bordereau.</desc><defs><marker id="infra-2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#a3844a" stroke-width="1.5"/></marker></defs><style>[data-infra] text{font-family:inherit;fill:#20334b}[data-infra] .infra-page{fill:#fffdf8;stroke:#ded6c9}[data-infra] .infra-campus{fill:#f3f0e8;stroke:#ded6c9;stroke-dasharray:7 5}[data-infra] .infra-card{fill:#fffdf8;stroke:#ded6c9}[data-infra] .infra-title{font-size:27px;font-weight:700}[data-infra] .infra-subtitle{font-size:17px;fill:#637080}[data-infra] .infra-campus-label{font-size:16px;font-weight:700;letter-spacing:1px;fill:#7f273f}[data-infra] .infra-card-title{font-size:19px;font-weight:700}[data-infra] .infra-detail{font-size:17px;fill:#637080}[data-infra] .infra-badge{fill:#f3f0e8}[data-infra] .infra-quantity{font-size:28px;font-weight:750;text-anchor:middle;fill:#7f273f}[data-infra] .infra-unit{font-size:14px;text-anchor:middle;fill:#637080}[data-infra] .infra-network{fill:#20334b}[data-infra] .infra-network-title{font-size:21px;font-weight:700;text-anchor:middle;fill:#fffdf8}[data-infra] .infra-network-detail{font-size:17px;text-anchor:middle;fill:#e7e9eb}[data-infra] .infra-peer{fill:none;stroke:#a3844a;stroke-dasharray:5 4}[data-infra] .infra-peer-title{font-size:18px;font-weight:650;text-anchor:middle}[data-infra] .infra-peer-detail{font-size:16px;text-anchor:middle;fill:#637080}[data-infra] .infra-status{font-size:17px;font-weight:650;fill:#7f273f}[data-infra] .infra-source{font-size:15px;fill:#637080}[data-infra] .infra-links,[data-infra] .infra-api-link{fill:none;stroke:#a3844a;stroke-width:2.5;stroke-linejoin:round}[data-infra] .infra-api-link{stroke-dasharray:5 4}[data-infra] .infra-icon-fill{fill:#20334b}[data-infra] .infra-gold-fill{fill:#a3844a}[data-infra] .infra-burgundy-fill{fill:#7f273f}[data-infra] .infra-icon-outline{fill:none;stroke:#20334b;stroke-width:2.5}[data-infra] .infra-icon-stroke{fill:none;stroke:#20334b;stroke-width:2.5;stroke-linecap:round}</style><rect x="1" y="1" width="1278" height="748" rx="18" class="infra-page"/><path d="M42 32h5v47h-5z" class="infra-burgundy-fill"/><text x="64" y="49" class="infra-title">Matériel proposé et connexions du campus</text><text x="64" y="80" class="infra-subtitle">Configuration du matériel · intranet du campus · architecture B/S</text><rect x="30" y="115" width="1220" height="550" rx="18" class="infra-campus"/><text x="54" y="147" class="infra-campus-label">INTRANET DU CAMPUS</text><g class="infra-links" marker-end="url(#infra-2-arrow)"><path d="M328 325v34h312v30"/><path d="M952 325v34H640v30"/><path d="M640 482v26H328v25"/><path d="M640 482v26h312v25"/></g><path d="M870 435h34" class="infra-api-link" marker-end="url(#infra-2-arrow)"/><g><rect x="54" y="175" width="548" height="150" rx="15" class="infra-card"/><g aria-hidden="true"><rect x="77" y="215" width="44" height="13" rx="3" class="infra-icon-fill"/><circle cx="111" cy="221.5" r="2" class="infra-gold-fill"/><rect x="77" y="234" width="44" height="13" rx="3" class="infra-icon-fill"/><circle cx="111" cy="240.5" r="2" class="infra-gold-fill"/><rect x="77" y="253" width="44" height="13" rx="3" class="infra-icon-fill"/><circle cx="111" cy="259.5" r="2" class="infra-gold-fill"/></g><text x="140" y="212" class="infra-card-title">Serveurs de calcul et de stockage</text><text x="140" y="251" class="infra-detail">Par unité · 4 × 32 Go de RAM DDR4</text><text x="140" y="279" class="infra-detail">6 disques SATA de 4 To</text><g><rect x="494" y="222" width="85" height="62" rx="12" class="infra-badge"/><text x="536.5" y="252" class="infra-quantity">3</text><text x="536.5" y="271" class="infra-unit">unités</text></g></g><g><rect x="678" y="175" width="548" height="150" rx="15" class="infra-card"/><g aria-hidden="true"><rect x="701" y="215" width="44" height="13" rx="3" class="infra-icon-fill"/><circle cx="735" cy="221.5" r="2" class="infra-gold-fill"/><rect x="701" y="234" width="44" height="13" rx="3" class="infra-icon-fill"/><circle cx="735" cy="240.5" r="2" class="infra-gold-fill"/><rect x="701" y="253" width="44" height="13" rx="3" class="infra-icon-fill"/><circle cx="735" cy="259.5" r="2" class="infra-gold-fill"/></g><text x="764" y="212" class="infra-card-title">Serveurs applicatifs</text><text x="764" y="251" class="infra-detail">Par unité · 4 × 32 Go de RAM DDR4</text><text x="764" y="279" class="infra-detail">6 disques SATA de 4 To</text><g><rect x="1118" y="222" width="85" height="62" rx="12" class="infra-badge"/><text x="1160.5" y="252" class="infra-quantity">2</text><text x="1160.5" y="271" class="infra-unit">unités</text></g></g><g><rect x="410" y="389" width="460" height="93" rx="16" class="infra-network"/><text x="640" y="426" class="infra-network-title">Connexion au réseau du campus</text><text x="640" y="455" class="infra-network-detail">Accès aux services par navigateur</text></g><g><rect x="904" y="394" width="306" height="82" rx="13" class="infra-peer"/><text x="1057" y="426" class="infra-peer-title">Autres systèmes du campus</text><text x="1057" y="452" class="infra-peer-detail">API soumises à autorisation</text></g><g><rect x="54" y="533" width="548" height="108" rx="15" class="infra-card"/><g aria-hidden="true"><rect x="77" y="564" width="44" height="34" rx="4" class="infra-icon-outline"/><path d="M99 599v10m-13 0h26" class="infra-icon-stroke"/></g><text x="140" y="573" class="infra-card-title">Postes de travail étudiants</text><text x="140" y="607" class="infra-detail">Ordinateurs pédagogiques courants</text><g><rect x="494" y="556" width="85" height="62" rx="12" class="infra-badge"/><text x="536.5" y="586" class="infra-quantity">60</text><text x="536.5" y="605" class="infra-unit">unités</text></g></g><g><rect x="678" y="533" width="548" height="108" rx="15" class="infra-card"/><g aria-hidden="true"><rect x="699" y="564" width="54" height="34" rx="4" class="infra-icon-outline"/><path d="M726 599v10m-13 0h26" class="infra-icon-stroke"/></g><text x="764" y="573" class="infra-card-title">Écran LED infonuagique intérieur</text><text x="764" y="607" class="infra-detail">100 pouces · en couleurs · partagé</text><g><rect x="1118" y="556" width="85" height="62" rx="12" class="infra-badge"/><text x="1160.5" y="586" class="infra-quantity">2</text><text x="1160.5" y="605" class="infra-unit">ensembles</text></g></g><text x="42" y="704" class="infra-status">Schéma de proposition · quantités prévues, installation non vérifiée.</text><text x="42" y="731" class="infra-source">Source : bordereau d’origine ; ordinateurs et écrans actualisés selon la configuration complémentaire du projet.</text></svg>
