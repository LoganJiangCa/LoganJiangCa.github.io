<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 559" width="984" height="559" role="img" aria-labelledby="module-map-figure-7-title module-map-figure-7-desc" lang="fr"><title id="module-map-figure-7-title">Analyse visuelle assistée</title><desc id="module-map-figure-7-desc">Ordre de lecture: 01. Fournir, à l’échelle de la plateforme, des capacités de bases de données structurées et de bases de données de graphes. 02. Intégrer Query et Python dans des boutons simples pour permettre une prise en main rapide. 03. Proposer une modélisation par glisser-déposer d’opérateurs pour que les étudiants construisent leurs propres modèles d’analyse de base sur des bases de données de graphes. 04. Conserver les démarches d’analyse et les modèles construits pour enrichir les connaissances.</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style><defs><marker id="module-map-figure-7-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-7-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-7-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="559" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">Structure de l’activité / explication de la conception</text><rect x="322" y="52" width="340" height="78" rx="22" fill="#294d6b"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacin