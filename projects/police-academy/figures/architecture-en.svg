<svg class="solution-diagram solution-diagram-architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1004" width="1140" height="1004" role="img" aria-labelledby="solution-architecture-en-1-title solution-architecture-en-1-desc" style="font-family:Segoe UI,Microsoft YaHei,sans-serif;max-width:100%;height:auto"><style>svg{font-family:"Segoe UI","Microsoft YaHei",sans-serif}.lab-small{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#627184}</style><title id="solution-architecture-en-1-title">Information Laboratory: Overall Architecture</title><desc id="solution-architecture-en-1-desc">The Information Laboratory contains an underlying database, a Big Data Practical Training Platform and a Designated School–Enterprise Partnership Laboratory. The platform contains Regulatory Data Retrieval Simulation, Visual Analytics Enablement, Realistic Courtroom Simulation, Dynamic Interactive Assessment, and the Tactics and Model Repository. The first two modules connect with data engineering and data analysis responsibilities. Visual Analytics Enablement and Realistic Courtroom Simulation provide software capabilities and application scenarios for the partnership laboratory; the repository provides separate knowledge support. The partnership laboratory uses server infrastructure and the big data platform to provide a data analysis environment for industry and enterprises. Paid cooperation can generate additional income for the academy, provide a venue for regulators’ internal learning, enhance the academy’s reputation and meet government requirements for digital transformation in higher education.</desc><defs><marker id="solution-architecture-en-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#763e50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solution-architecture-en-1-purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#76687f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="28" y="28" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.5" class="">OVERALL ARCHITECTURE · PRACTICAL TRAINING AND SCHOOL–ENTERPRISE COOPERATION</text><rect x="20" y="50" width="1100" height="938" rx="26" fill="#f2eee2" stroke="#763e50" stroke-width="1.7"/><rect x="48" y="62" width="1044" height="78" rx="18" fill="#293b4b" stroke="#b89a61" stroke-width="1.7"/><text x="570" y="101" fill="#fffdf8" font-size="34" font-weight="750" text-anchor="middle" letter-spacing="0" class="">Information Laboratory</text><text x="570" y="128" fill="#e2d9c5" font-size="13.5" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Server infrastructure and the big data platform support practical training and school–enterprise cooperation.</text><rect x="48" y="154" width="636" height="682" rx="21" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.4"/><rect x="62" y="164" width="608" height="36" rx="11" fill="#763e50"/><text x="346" y="189" fill="#fffdf8" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0" class="">Big Data Practical Training Platform</text><text x="650" y="187" fill="#fffdf8" font-size="10.5" font-weight="500" text-anchor="end" letter-spacing="0" class="">5 MODULES</text><g class="sd-module" data-module="retrieval"><rect x="76" y="212" width="580" height="110" rx="15" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.2"/><text x="94" y="237" fill="#6f766f" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1" class="">01</text><g transform="translate(94 254) scale(0.88)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="24" height="31" rx="4"/><path d="M10 9H21M10 15H20M10 21H16M24 24H37M32 19L37 24L32 29"/></g><text x="148" y="240" fill="#293b4b" font-size="18.5" font-weight="600" text-anchor="start" letter-spacing="0" class="">Regulatory Data Retrieval Simulation</text><text x="148" y="262" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">Select channels by regulatory field and case · Simulate retrieval procedures</text><text x="148" y="278" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">and workflows · Assess compliance, accuracy and efficiency</text><text x="148" y="297" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="start" letter-spacing="0" class="">Related data engineer responsibilities: data requirements, retrieval workflows and</text><text x="148" y="311.5" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="start" letter-spacing="0" class="">data handover.</text></g><g class="sd-module" data-module="analytics"><rect x="76" y="334" width="580" height="110" rx="15" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.2"/><text x="94" y="359" fill="#6f766f" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1" class="">02</text><g transform="translate(94 376) scale(0.88)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 30V4M2 30H36M8 23L16 15L24 20L34 7"/><circle cx="16" cy="15" r="2"/><circle cx="24" cy="20" r="2"/></g><text x="148" y="362" fill="#293b4b" font-size="18.5" font-weight="600" text-anchor="start" letter-spacing="0" class="">Visual Analytics Enablement</text><text x="148" y="384" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">For information technology students · Understand data relationships · Develop</text><text x="148" y="400" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">an analytical approach</text><text x="148" y="419" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="start" letter-spacing="0" class="">Related data analyst responsibilities: exploring data relationships, visual</text><text x="148" y="433.5" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="start" letter-spacing="0" class="">presentation and analytical modeling.</text></g><g class="sd-module" data-module="court"><rect x="76" y="456" width="580" height="110" rx="15" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.2"/><text x="94" y="481" fill="#6f766f" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1" class="">03</text><g transform="translate(94 498) scale(0.88)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11L19 2L35 11M6 13H32M8 14V29M19 14V29M30 14V29M3 33H35M6 29H32"/></g><text x="148" y="484" fill="#293b4b" font-size="18.5" font-weight="600" text-anchor="start" letter-spacing="0" class="">Realistic Courtroom Simulation</text><text x="148" y="506" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">Select a type and draw a random case · Assign student roles · A robot judge</text><text x="148" y="522" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">guides the hearing</text><text x="148" y="541" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="start" letter-spacing="0" class="">Designed specifically for law and political science students.</text></g><g class="sd-module" data-module="exams"><rect x="76" y="578" width="580" height="110" rx="15" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.2"/><text x="94" y="603" fill="#6f766f" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1" class="">04</text><g transform="translate(94 620) scale(0.88)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="28" height="29" rx="4"/><path d="M13 5V2H25V5M11 17L15 21L22 13M11 27H27"/></g><text x="148" y="606" fill="#293b4b" font-size="18.5" font-weight="600" text-anchor="start" letter-spacing="0" class="">Dynamic Interactive Assessment</text><text x="148" y="628" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">Scope, quantity and time · Retrieval success · Import into the analysis module</text></g><g class="sd-module" data-module="knowledge"><rect x="76" y="700" width="580" height="110" rx="15" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.2"/><text x="94" y="725" fill="#6f766f" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1" class="">05</text><g transform="translate(94 742) scale(0.88)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8C13 3 7 3 2 5V30C8 28 14 29 19 33C24 29 30 28 36 30V5C31 3 25 3 19 8ZM19 8V33M7 12L13 14M7 19L13 21M25 14L31 12M25 21L31 19"/></g><text x="148" y="728" fill="#293b4b" font-size="18.5" font-weight="600" text-anchor="start" letter-spacing="0" class="">Tactics and Model Repository</text><text x="148" y="750" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">Organize by case type · Keep students’ analytical approaches · Preserve</text><text x="148" y="766" fill="#6f766f" font-size="12.5" font-weight="400" text-anchor="start" letter-spacing="0" class="">reusable models</text></g><path data-link="retrieval-analytics" d="M366 322V334" fill="none" stroke="#763e50" stroke-width="1.5" marker-end="url(#solution-architecture-en-1-arrow)"><title>Retrieved data → import into Visual Analytics Enablement</title></path><g fill="none" stroke="#763e50" stroke-width="1.8"><path data-link="analytics-cooperation" d="M656 405H850" marker-end="url(#solution-architecture-en-1-arrow)"/><path data-link="court-cooperation" d="M656 527H850" marker-end="url(#solution-architecture-en-1-arrow)"/></g><text x="753" y="371" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="middle" letter-spacing="0" class="">Software capabilities</text><text x="753" y="388" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="middle" letter-spacing="0" class="">Application scenarios</text><text x="753" y="493" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="middle" letter-spacing="0" class="">Software capabilities</text><text x="753" y="510" fill="#763e50" font-size="11.8" font-weight="500" text-anchor="middle" letter-spacing="0" class="">Application scenarios</text><path data-link="knowledge-cooperation" d="M656 771H850" fill="none" stroke="#76687f" stroke-width="1.8" marker-end="url(#solution-architecture-en-1-purple-arrow)"/><text x="753" y="755" fill="#76687f" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0" class="">Repository support</text><rect x="850" y="154" width="242" height="682" rx="21" fill="#fffdf8" stroke="#763e50" stroke-width="1.5"/><rect x="862" y="164" width="218" height="40" rx="11" fill="#763e50"/><text x="971" y="180" fill="#fffdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0" class="">Designated School–Enterprise</text><text x="971" y="196" fill="#fffdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0" class="">Partnership Laboratory</text><text x="971" y="222" fill="#6f766f" font-size="13.2" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Server infrastructure and the</text><text x="971" y="240" fill="#6f766f" font-size="13.2" font-weight="400" text-anchor="middle" letter-spacing="0" class="">big data platform provide a</text><text x="971" y="258" fill="#6f766f" font-size="13.2" font-weight="400" text-anchor="middle" letter-spacing="0" class="">data analysis environment for</text><text x="971" y="276" fill="#6f766f" font-size="13.2" font-weight="400" text-anchor="middle" letter-spacing="0" class="">industry and enterprises.</text><path d="M872 318H1070" stroke="#d2d1c2"/><text x="971" y="351" fill="#763e50" font-size="14.5" font-weight="600" text-anchor="middle" letter-spacing="0" class="">Cooperation services</text><text x="971" y="377" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Connect software capabilities</text><text x="971" y="396" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="middle" letter-spacing="0" class="">and application scenarios,</text><text x="971" y="415" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="middle" letter-spacing="0" class="">with support from the Tactics</text><text x="971" y="434" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="middle" letter-spacing="0" class="">and Model Repository.</text><rect x="870" y="466" width="202" height="288" rx="15" fill="#f2eee2" stroke="#d2d1c2"/><text x="971" y="491" fill="#763e50" font-size="14.5" font-weight="650" text-anchor="middle" letter-spacing="0" class="">Potential cooperation</text><text x="971" y="508" fill="#763e50" font-size="14.5" font-weight="650" text-anchor="middle" letter-spacing="0" class="">revenue</text><text x="971" y="532" fill="#293b4b" font-size="13.4" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Paid cooperation creates</text><text x="971" y="549" fill="#293b4b" font-size="13.4" font-weight="400" text-anchor="middle" letter-spacing="0" class="">additional income for the</text><text x="971" y="566" fill="#293b4b" font-size="13.4" font-weight="400" text-anchor="middle" letter-spacing="0" class="">academy.</text><path d="M888 574H1054" stroke="#d2d1c2"/><text x="971" y="596" fill="#293b4b" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Provide a venue for</text><text x="971" y="612" fill="#293b4b" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="0" class="">regulators’ internal</text><te