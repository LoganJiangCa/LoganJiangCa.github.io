<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 359" width="984" height="359" role="img" aria-labelledby="module-map-figure-8-title module-map-figure-8-desc" lang="fr"><title id="module-map-figure-8-title">Simulation réaliste de procès</title><desc id="module-map-figure-8-desc">Ordre de lecture: 01. Choisir un type d’affaire. 02. Tirer au hasard un cas dans la base de données. 03. Attribuer les rôles aux étudiants qui entrent dans le scénario. 04. Mener l’audience simulée avec le robot dans le rôle du juge.</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style><defs><marker id="module-map-figure-8-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-8-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-8-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="359" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">Structure de l’activité / explication de la conception</text><rect x="322" y="52" width="340" height="78" rx="22" fill="#96733c"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacing="1">MODULE</text><text x="492" y="103" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600"><tspan x="492" dy="0">Simulation réaliste de procès</tspan></text><path class="module-map-link" data-from="1" data-to="2" data-direction="right" d="M238 243.5H261