="25">entrent dans le</tspan><tspan x="532" dy="25">scénario.</tspan></text></g><g><rect x="750" y="156" width="210" height="175" rx="22" fill="#f7eef8" stroke="#c8a9cd" stroke-width="1.5"/><rect x="770" y="174" width="40" height="30" rx="10" fill="#855787"/><text x="790" y="195" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">04</text><text x="774" y="234" font-size="17" fill="#293b4b"><tspan x="774" dy="0">Mener l’audience</tspan><tspan x="774" dy="25">simulée avec le</tspan><tspan x="774" dy="25">robot dans le rôle</tspan><tspan x="774" dy="25">du juge.</tspan></text></g></svg>
