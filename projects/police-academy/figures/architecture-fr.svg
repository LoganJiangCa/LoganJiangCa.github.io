<svg class="solution-diagram solution-diagram-architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1004" width="1140" height="1004" role="img" aria-labelledby="solution-architecture-fr-3-title solution-architecture-fr-3-desc" style="font-family:Segoe UI,Microsoft YaHei,sans-serif;max-width:100%;height:auto"><style>svg{font-family:"Segoe UI","Microsoft YaHei",sans-serif}.lab-small{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#627184}</style><title id="solution-architecture-fr-3-title">Architecture générale du Laboratoire d’information</title><desc id="solution-architecture-fr-3-desc">Le Laboratoire d’information comprend une base de données sous-jacente, une Plateforme de formation pratique au big data et un Laboratoire de partenariat école–entreprise désigné. La plateforme regroupe la Simulation de recherche de données réglementaires, l’Analyse visuelle assistée, la Simulation réaliste de procès, l’Évaluation interactive dynamique et le Référentiel de méthodes et de modèles. Les deux premiers modules correspondent à des responsabilités liées à l’ingénierie et à l’analyse des données. L’analyse visuelle et la simulation de procès fournissent des capacités logicielles et des scénarios d’application au laboratoire partenaire ; le référentiel apporte un soutien distinct en connaissances. Les serveurs et la plateforme de big data offrent un environnement d’analyse aux acteurs de l’industrie et aux entreprises. La coopération rémunérée peut apporter des recettes supplémentaires à l’école, accueillir la formation interne des organismes de réglementation, renforcer la réputation de l’école et répondre aux exigences publiques de transformation numérique de l’enseignement supérieur.</desc><defs><marker id="solution-architecture-fr-3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#763e50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solution-architecture-fr-3-purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#76687f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="28" y="28" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="0.5" class="">ARCHITECTURE GÉNÉRALE · FORMATION PRATIQUE ET COOPÉRATION ÉCOLE–ENTREPRISE</text><rect x="20" y="50" width="1100" height="938" rx="26" fill="#f2eee2" stroke="#763e50" stroke-width="1.7"/><rect x="48" y="62" width="1044" height="78" rx="18" fill="#293b4b" stroke="#b89a61" stroke-width="1.7"/><text x="570" y="101" fill="#fffdf8" font-size="34" font-weight="750" text-anchor="middle" letter-spacing="0" class="">Laboratoire d’information</text><text x="570" y="128" fill="#e2d9c5" font-size="13.5" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Les serveurs et la plateforme de big data soutiennent la formation pratique et la coopération école–entreprise.</text><rect x="48" y="154" width="636" height="682" rx="21" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.4"/><rect x="62" y="164" width="608" height="36" rx="11" fill="#763e50"/><text x="346" y="189" fill="#fffdf8" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0" class="">Plateforme de formation pratique au big data</text><text x="650" y="187" fill="#fffdf8" font-size="10.5" font-weight="500" text-anchor="end" letter-spacing="0" class="">5 MODULES</text><g class="sd-module" data-module="retrieval"><rect x="76" y="212" width="580" height="110" rx="15" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.2"/><text x="94" y="237" fill="#6f766f" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1" class="">01</text><g transform="translate(94 254) scale(0.88)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><