M10 15H20M10 21H16M24 24H37M32 19L37 24L32 29"/></g><text x="136" y="329" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Define data requirements</text><text x="136" y="372" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Choose the required data scope · Determine a</text><text x="136" y="391" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">reasonable retrieval quantity</text></g><path d="M290 414V446" fill="none" stroke="#763e50" stroke-width="1.7" marker-end="url(#solution-workflow-en-1-arrow)"/><g class="sd-workflow-step" data-module="retrieval"><rect x="60" y="446" width="460" height="112" rx="16" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.3"/><text x="78" y="473" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1" class="">02</text><g transform="translate(78 494) scale(0.85)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="24" height="29" rx="4"/><path d="M10 11H21M10 17H21M10 23H17M31 11V30M27 26L31 30L35 26"/></g><text x="136" y="473" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Prepare retrieval materials and workflow</text><text x="136" y="516" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Simulated request documents and credentials · Practise</text><text x="136" y="535" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">the designed workflow and handovers</text></g><path d="M290 558V590" fill="none" stroke="#763e50" stroke-width="1.7" marker-end="url(#solution-workflow-en-1-arrow)"/><g class="sd-workflow-step" data-module="retrieval"><rect x="60" y="590" width="460" height="112" rx="16" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.