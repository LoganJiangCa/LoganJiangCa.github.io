<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 473" width="984" height="473" role="img" aria-labelledby="module-map-figure-1-title module-map-figure-1-desc" lang="en"><title id="module-map-figure-1-title">Regulatory Data Retrieval Simulation</title><desc id="module-map-figure-1-desc">Read in order: 01. Let students choose retrieval channels for cases in different regulatory domains. 02. Simulate data-retrieval formalities and procedures for different regulatory domains and case types. 03. Evaluate whether the student’s retrieval process is compliant, accurate and efficient within the relevant regulatory domain. 04. Archive and seal all retrieval procedures and documentation for scoring, then return the data to the database for visual analysis.</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style><defs><marker id="module-map-figure-1-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-1-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-1-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="473" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">Activity structure / design explanation</text><rect x="322" y="52" width="340" height="92" rx="22" fill="#446d68"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacing="1">MODULE</text><text x="492" y="103" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600"><tspan x="492" dy="0">Regulatory Data Retrieval</tspan><tspan x="492" dy="25">Simulation</tspan></text><path class="module-map-link" data-from="1" data-to="2" data-direction="right" d="M238 307.5H261" fill="none" stroke="#315f96" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-1-arrow-1)"/><path class="module-map-link" data-from="2" data-to="3" data-direction="right" d="M480 307.5H503" fill="none" stroke="#287d69" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-1-arrow-2)"/><path class="module-map-link" data-from="3" data-to="4" data-direction="right" d="M722 307.5H745" fill="none" stroke="#926a21" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-1-arrow-3)"/><g><rect x="24" y="170" width="210" height="275" rx="22" fill="#edf4ff" stroke="#9ebce1" stroke-width="1.5"/><rect x="44" y="188" width="40" height="30" rx="10" fill="#315f96"/><text x="64" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">01</text><text x="48" y="248" font-size="17" fill="#293b4b"><tspan x="48" dy="0">Let students</tspan><tspan x="48" dy="25">choose retrieval</tspan><tspan x="48" dy="25">channels for cases</tspan><tspan x="48" dy="25">in different</tspan><tspan x="48" dy="25">regulatory</tspan><tspan x="48" dy="25">domains.</tspan></text></g><g><rect x="266" y="170" width="210" height="275" rx="22" fill="#eaf7f0" stroke="#91c8b5" stroke-width="1.5"/><rect x="286" y="188" width="40" height="30" rx="10" fill="#287d69"/><text x="306" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">02</text><text x="290" y="248" font-size="17" fill="#293b4b"><tspan x="290" dy="0">Simulate</tspan><tspan x="290" dy="25">data-retrieval</tspan><tspan x="290" dy="25">formalities and</tspan><tspan x="290" dy="25">procedures for</tspan><tspan x="290" dy="25">different</tspan><tspan x="290" dy="25">regulatory domains</tspan><tspan x="290" dy="25">and case types.</tspan></text></g><g><rect x="508" y="170" width="210" height="275" rx="22" fill="#fff6df" stroke="#dfc381" stroke-width="1.5"/><rect x="528" y="188" width="40" height="30" rx="10" fill="#926a21"/><text x="548" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">03</text><text x="532" y="248" font-size="17" fill="#293b4b"><tspan x="532" dy="0">Evaluate whether</tspan><tspan x="532" dy="25">the student’s</tspan><tspan x="532" dy="25">retrieval process</tspan><tspan x="532" dy="25">is compliant,</tspan><tspan x="532" dy="25">accurate and</tspan><tspan x="532" dy="25">efficient within</tspan><tspan x="532" dy="25">the relevant</tspan><tspan x="532" dy="25">regulatory domain.</tspan></text></g><g><rect x="750" y="170" width="210" height="275" rx="22" fill="#f7eef8" stroke="#c8a9cd" stroke-width="1.5"/><rect x="770" y="188" width="40" height="30" rx="10" fill="#855787"/><text x="790" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">04</text><text x="774" y="248" font-size="17" fill="#293b4b"><tspan x="774" dy="0">Archive and seal all</tspan><tspan x="774" dy="25">retrieval</tspan><tspan x="774" dy="25">procedures and</tspan><tspan x="774" dy="25">documentation for</tspan><tspan x="774" dy="25">scoring, then</tspan><tspan x="774" dy="25">return the data to</tspan><tspan x="774" dy="25">the database for</tspan><tspan x="774" dy="25">visual analysis.</tspan></text></g></svg>
