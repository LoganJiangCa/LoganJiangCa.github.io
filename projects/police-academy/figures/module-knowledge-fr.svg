<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 398" width="984" height="398" role="img" aria-labelledby="module-map-figure-10-title module-map-figure-10-desc" lang="fr"><title id="module-map-figure-10-title">Référentiel de méthodes et de modèles</title><desc id="module-map-figure-10-desc">Ordre de lecture: 01. Classer les contributions par type d’affaire. 02. Consigner la question d’analyse et les informations nécessaires. 03. Conserver les étapes d’analyse et les modèles des étudiants. 04. Organiser les connaissances pour leur consultation et leur réutilisation.</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style><defs><marker id="module-map-figure-10-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-10-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-10-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="398" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">Structure de l’activité / explication de la conception</text><rect x="322" y="52" width="340" height="92" rx="22" fill="#66587b"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacing="1">MODULE</text><text x="492" y="103" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600"><tspan x="492" dy="0">Référentiel de méthodes et de</tspan><tspan x="492" dy="25">modèles</tspan></te