<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 498" width="984" height="498" role="img" aria-labelledby="module-map-figure-6-title module-map-figure-6-desc" lang="fr"><title id="module-map-figure-6-title">Simulation de recherche de données réglementaires</title><desc id="module-map-figure-6-desc">Ordre de lecture: 01. Permettre aux étudiants de choisir les canaux d’accès aux données selon les affaires et les domaines réglementaires. 02. Simuler les formalités et les procédures de recherche de données selon le domaine réglementaire et le type d’affaire. 03. Évaluer la conformité, l’exactitude et l’efficacité de la démarche de l’étudiant dans le domaine réglementaire concerné. 04. Archiver et sceller les procédures et les documents pour les noter, puis renvoyer les données vers la base pour l’analyse visuelle.</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style><defs><marker id="module-map-figure-6-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-6-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-6-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="498" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">Structure de l’activité / explication de la conception</text><rect x="322" y="52" width="340" height="92" rx="22" fill="#446d68"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacing="1">MODULE</text><text x="492" y="103" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600"><tspan x="492" dy="0">Simulation de recherche de</tspan><tspan x="492" dy="25">données réglementaires</tspan></text><path class="module-map-link" data-from="1" data-to="2" data-direction="right" d="M238 320H261" fill="none" stroke="#315f96" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-6-arrow-1)"/><path class="module-map-link" data-from="2" data-to="3" data-direction="right" d="M480 320H503" fill="none" stroke="#287d69" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-6-arrow-2)"/><path class="module-map-link" data-from="3" data-to="4" data-direction="right" d="M722 320H745" fill="none" stroke="#926a21" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-6-arrow-3)"/><g><rect x="24" y="170" width="210" height="300" rx="22" fill="#edf4ff" stroke="#9ebce1" stroke-width="1.5"/><rect x="44" y="188" width="40" height="30" rx="10" fill="#315f96"/><text x="64" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">01</text><text x="48" y="248" font-size="17" fill="#293b4b"><tspan x="48" dy="0">Permettre aux</tspan><tspan x="48" dy="25">étudiants de</tspan><tspan x="48" dy="25">choisir les canaux</tspan><tspan x="48" dy="25">d’accès aux</tspan><tspan x="48" dy="25">données selon les</tspan><tspan x="48" dy="25">affaires et les</tspan><tspan x="48" dy="25">domaines</tspan><tspan x="48" dy="25">réglementaires.</tspan></text></g><g><rect x="266" y="170" width="210" height="300" rx="22" fill="#eaf7f0" stroke="#91c8b5" stroke-width="1.5"/><rect x="286" y="188" width="40" height="30" rx="10" fill="#287d69"/><text x="306" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">02</text><text x="290" y="248" font-size="17" fill="#293b4b"><tspan x="290" dy="0">Simuler les</tspan><tspan x="290" dy="25">formalités et les</tspan><tspan x="290" dy="25">procédures de</tspan><tspan x="290" dy="25">recherche de</tspan><tspan x="290" dy="25">données selon le</tspan><tspan x="290" dy="25">domaine</tspan><tspan x="290" dy="25">réglementaire et le</tspan><tspan x="290" dy="25">type d’affaire.</tspan></text></g><g><rect x="508" y="170" width="210" height="300" rx="22" fill="#fff6df" stroke="#dfc381" stroke-width="1.5"/><rect x="528" y="188" width="40" height="30" rx="10" fill="#926a21"/><text x="548" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">03</text><text x="532" y="248" font-size="17" fill="#293b4b"><tspan x="532" dy="0">Évaluer la</tspan><tspan x="532" dy="25">conformité,</tspan><tspan x="532" dy="25">l’exactitude et</tspan><tspan x="532" dy="25">l’efficacité de la</tspan><tspan x="532" dy="25">démarche de</tspan><tspan x="532" dy="25">l’étudiant dans le</tspan><tspan x="532" dy="25">domaine</tspan><tspan x="532" dy="25">réglementaire</tspan><tspan x="532" dy="25">concerné.</tspan></text></g><g><rect x="750" y="170" width="210" height="300" rx="22" fill="#f7eef8" stroke="#c8a9cd" stroke-width="1.5"/><rect x="770" y="188" width="40" height="30" rx="10" fill="#855787"/><text x="790" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">04</text><text x="774" y="248" font-size="17" fill="#293b4b"><tspan x="774" dy="0">Archiver et sceller</tspan><tspan x="774" dy="25">les procédures et</tspan><tspan x="774" dy="25">les documents pour</tspan><tspan x="774" dy="25">les noter, puis</tspan><tspan x="774" dy="25">renvoyer les</tspan><tspan x="774" dy="25">données vers la</tspan><tspan x="774" dy="25">base pour</tspan><tspan x="774" dy="25">l’analyse visuelle.</tspan></text></g></svg>
