<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 398" width="984" height="398" role="img" aria-labelledby="module-map-figure-4-title module-map-figure-4-desc" lang="en"><title id="module-map-figure-4-title">Dynamic Interactive Assessment</title><desc id="module-map-figure-4-desc">Read in order: 01. Choose the scope and quantity of data to retrieve for a case. 02. Prepare retrieval documents and credentials, then follow the required procedure. 03. Complete data retrieval and import the results into the connected analysis module. 04. Evaluate scope, quantity, elapsed time, retrieval success and import success.</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}</style><defs><marker id="module-map-figure-4-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-4-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-4-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="398" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">Activity structure / design explanation</text><rect x="322" y="52" width="340" height="92" rx="22" fill="#7e3043"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacing="1">MODULE</text><text x="492" y="103" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600"><tspan x="492" dy="0">Dynamic Interactive</tspan><tspan x="492" dy="25">Assessment</tspan></text><path class="module-map-link" data-from="1" data-to="2" data-direction="right" d="M238 270H261" fill="none" stroke="#315f96" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-4-arrow-1)"/><path class="module-map-link" data-from="2" data-to="3" data-direction="right" d="M480 270H503" fill="none" stroke="#287d69" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-4-arrow-2)"/><path class="module-map-link" data-from="3" data-to="4" data-direction="right" d="M722 270H745" fill="none" stroke="#926a21" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-4-arrow-3)"/><g><rect x="24" y="170" width="210" height="200" rx="22" fill="#edf4ff" stroke="#9ebce1" stroke-width="1.5"/><rect x="44" y="188" width="40" height="30" rx="10" fill="#315f96"/><text x="64" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">01</text><text x="48" y="248" font-size="17" fill="#293b4b"><tspan x="48" dy="0">Choose the scope</tspan><tspan x="48" dy="25">and quantity of</tspan><tspan x="48" dy="25">data to retrieve</tspan><tspan x="48" dy="25">for a case.</tspan></text></g><g><rect x="266" y="170" width="210" height="200" rx="22" fill="#eaf7f0" stroke="#91c8b5" stroke-width="1.5"/><rect x="286" y="188" width="40" height="30" rx="10" fill="#287d69"/><text x="306" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">02</text><text x="290" y="248" font-size="17" fill="#293b4b"><tspan x="290" dy="0">Prepare retrieval</tspan><tspan x="290" dy="25">documents and</tspan><tspan x="290" dy="25">credentials, then</tspan><tspan x="290" dy="25">follow the required</tspan><tspan x="290" dy="25">procedure.</tspan></text></g><g><rect x="508" y="170" width="210" height="200" rx="22" fill="#fff6df" stroke="#dfc381" stroke-width="1.5"/><rect x="528" y="188" width="40" height="30" rx="10" fill="#926a21"/><text x="548" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">03</text><text x="532" y="248" font-size="17" fill="#293b4b"><tspan x="532" dy="0">Complete data</tspan><tspan x="532" dy="25">retrieval and</tspan><tspan x="532" dy="25">import the results</tspan><tspan x="532" dy="25">into the connected</tspan><tspan x="532" dy="25">analysis module.</tspan></text></g><g><rect x="750" y="170" width="210" height="200" rx="22" fill="#f7eef8" stroke="#c8a9cd" stroke-width="1.5"/><rect x="770" y="188" width="40" height="30" rx="10" fill="#855787"/><text x="790" y="209" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Consolas,monospace" font-weight="600">04</text><text x="774" y="248" font-size="17" fill="#293b4b"><tspan x="774" dy="0">Evaluate scope,</tspan><tspan x="774" dy="25">quantity, elapsed</tspan><tspan x="774" dy="25">time, retrieval</tspan><tspan x="774" dy="25">success and import</tspan><tspan x="774" dy="25">success.</tspan></text></g></svg>
