ion des rôles · Préciser les rôles</text><text x="696" y="679" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">dans l’audience simulée</text></g><path d="M850 702V734" fill="none" stroke="#763e50" stroke-width="1.7" marker-end="url(#solution-workflow-fr-2-arrow)"/><g class="sd-workflow-step" data-module="court"><rect x="620" y="734" width="460" height="112" rx="16" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.3"/><text x="638" y="761" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1" class="">04</text><g transform="translate(638 782) scale(0.85)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11L19 2L35 11M6 13H32M8 14V29M19 14V29M30 14V29M3 33H35M6 29H32"/></g><text x="696" y="761" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Mener l’audience simulée</text><text x="696" y="804" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Un juge robot guide · le déroulement du procès simulé</text></g></g><g fill="none" stroke="#763e50" stroke-width="1.8"><path data-link="exams-analysis" d="M290 152V230" marker-end="url(#solution-workflow-fr-2-arrow)"/><path data-link="exams-court" d="M850 152V230" marker-end="url(#solution-workflow-fr-2-arrow)"/></g><g class="sd-knowledge-shared" data-module="knowledge"><rect x="40" y="954" width="1060" height="100" rx="20" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.3"/><g transform="translate(68 986) scale(1)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8C13 3 7 3 2 5V30C8 28 14 29 19 33C24 29 30 28 36 30V5C31 3 25 3 19 8ZM19 8V33M7 12L13 14M7 19L13 21M25 14L31 12M25 21L31 19"/></g><text x="570" y="993" fill="#293b4b" font-size="25" font-weight="600" text-anchor="middle" letter-spacing="0" cl