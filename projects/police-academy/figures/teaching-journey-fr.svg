></g><text x="136" y="761" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Analyse visuelle assistée</text><text x="136" y="804" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Importer les données recueillies · Développer une</text><text x="136" y="823" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">démarche d’analyse</text></g></g><g class="sd-workflow-panel" data-flow="court"><rect x="600" y="230" width="500" height="660" rx="21" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.3"/><text x="850" y="260" fill="#293b4b" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0" class="">Simulation réaliste de procès</text><text x="850" y="285" fill="#293b4b" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0" class="">et activités pédagogiques</text><g class="sd-workflow-step" data-module="court"><rect x="620" y="302" width="460" height="112" rx="16" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.3"/><text x="638" y="329" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1" class="">01</text><g transform="translate(638 350) scale(0.85)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11L19 2L35 11M6 13H32M8 14V29M19 14V29M30 14V29M3 33H35M6 29H32"/></g><text x="696" y="329" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Choisir un type d’affaire</text><text x="696" y="372" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Sélectionner le type d’affaire adapté · dans la</text><text x="696" y="391" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">bibliothèque de cas</text></g><path d="M850 414V446" fill="none" stroke="#763e50" stroke