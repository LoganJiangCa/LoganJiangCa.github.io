<svg class="solution-diagram solution-diagram-workflow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1080" width="1140" height="1080" role="img" aria-labelledby="solution-workflow-fr-2-title solution-workflow-fr-2-desc" style="font-family:Segoe UI,Microsoft YaHei,sans-serif;max-width:100%;height:auto"><style>svg{font-family:"Segoe UI","Microsoft YaHei",sans-serif}.lab-small{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#627184}</style><title id="solution-workflow-fr-2-title">Parcours pédagogiques et conception de l’évaluation</title><desc id="solution-workflow-fr-2-desc">L’Évaluation interactive dynamique pointe vers deux parcours pédagogiques équivalents : la bibliothèque de cas d’analyse de données et les activités pédagogiques, et la Simulation réaliste de procès et activités pédagogiques. Le parcours d’analyse comprend la définition des besoins, la préparation des pièces et le suivi de la procédure, la Simulation de recherche de données réglementaires et l’Analyse visuelle assistée. Le parcours judiciaire comprend le choix du type d’affaire, le tirage d’un cas, l’attribution des rôles et une audience simulée guidée par un juge robot. Les deux parcours alimentent le Référentiel de méthodes et de modèles. La recherche simulée évalue la conformité, l’exactitude et l’efficacité, archive, scelle et note les procédures, puis retourne les données. Élément central de l’informatisation, cette approche remplace les examens sur papier par des évaluations pratiques interactives portant sur les procédures, l’efficacité et la conformité.</desc><defs><marker id="solution-workflow-fr-2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#763e50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solution-workflow-fr-2-purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#76687f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="sd-assessment" data-module="exams"><rect x="40" y="52" width="1060" height="100" rx="20" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.3"/><g transform="translate(68 84) scale(1)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="28" height="29" rx="4"/><path d="M13 5V2H25V5M11 17L15 21L22 13M11 27H27"/></g><text x="570" y="91" fill="#293b4b" font-size="25" font-weight="600" text-anchor="middle" letter-spacing="0" class="">Évaluation interactive dynamique</text><text x="570" y="120" fill="#6f766f" font-size="13.5" font-weight="400" text-anchor="middle" letter-spacing="0" class="">Au cœur de l’informatisation : passer des examens sur papier à des évaluations pratiques interactives, avec une notation globale des</text><text x="570" y="137" fill="#6f766f" font-size="13.5" font-weight="400" text-anchor="middle" letter-spacing="0" class="">procédures, de l’efficacité et de la conformité.</text></g><g class="sd-workflow-panel" data-flow="analysis"><rect x="40" y="230" width="500" height="660" rx="21" fill="#f2eee2" stroke="#d2d1c2" stroke-width="1.3"/><text x="290" y="260" fill="#293b4b" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0" class="">Bibliothèque de cas d’analyse</text><text x="290" y="285" fill="#293b4b" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0" class="">de données et activités pédagogiques</text><g class="sd-workflow-step" data-module="retrieval"><rect x="60" y="302" width="460" height="112" rx="16" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.3"/><text x="78" y="329" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1" class="">01</text><g transform="translate(78 350) scale(0.85)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="24" height="31" rx="4"/><path d="M10 9H21M10 15H20M10 21H16M24 24H37M32 19L37 24L32 29"/></g><text x="136" y="329" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Définir les besoins en données</text><text x="136" y="372" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Choisir le périmètre des données nécessaires ·</text><text x="136" y="391" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Déterminer un volume de recherche raisonnable</text></g><path d="M290 414V446" fill="none" stroke="#763e50" stroke-width="1.7" marker-end="url(#solution-workflow-fr-2-arrow)"/><g class="sd-workflow-step" data-module="retrieval"><rect x="60" y="446" width="460" height="112" rx="16" fill="#fffdf8" stroke="#d2d1c2" stroke-width="1.3"/><text x="78" y="473" fill="#6f766f" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1" class="">02</text><g transform="translate(78 494) scale(0.85)" fill="none" stroke="#763e50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="24" height="29" rx="4"/><path d="M10 11H21M10 17H21M10 23H17M31 11V30M27 26L31 30L35 26"/></g><text x="136" y="473" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">Préparer les pièces et suivre la</text><text x="136" y="493" fill="#293b4b" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0" class="">procédure</text><text x="136" y="516" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">Simuler les demandes et justificatifs · Pratiquer la</text><text x="136" y="535" fill="#6f766f" font-size="13.1" font-weight="400" text-anchor="start" letter-spacing="0" class="">procédure et les transmissions</text></g><path d="M290 558V590