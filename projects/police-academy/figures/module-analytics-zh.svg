<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 384" width="984" height="384" role="img" aria-labelledby="module-map-figure-2-title module-map-figure-2-desc" lang="zh-CN"><title id="module-map-figure-2-title">可视化分析赋能</title><desc id="module-map-figure-2-desc">按顺序阅读: 01. 提供平台级别的结构化数据库和图数据库能力。 02. 将 Query 和 Python 集成为傻瓜式按钮，方便学生快速上手。 03. 提供拖拉拽式的算子建模平台能力，学生可依据自己的思路建立不同的基础图数据库分析模型。 04. 分析思路、搭建模型，均可用于知识沉淀。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><defs><marker id="module-map-figure-2-arrow-1" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#315f96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-2-arrow-2" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#287d69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="module-map-figure-2-arrow-3" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#926a21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="984" height="384" rx="22" fill="#fffdf8"/><text x="24" y="28" fill="#6f746e" font-size="15">教学活动结构 / 设计说明</text><rect x="322" y="52" width="340" height="78" rx="22" fill="#294d6b"/><text x="492" y="76" text-anchor="middle" fill="#e8e6df" font-size="12" letter-spacing="1">教学模块</text><text x="492" y="103" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600"><tspan x="492" dy="0">可视化分析赋能</tspan></text><path class="module-map-link" data-from="1" data-to="2" data-direction="right" d="M238 256H261" fill="none" stroke="#315f96" stroke-width="2.7" stroke-linecap="round" marker-end="url(#module-map-figure-2-arrow-1)"/><path class="module-map-link" dat